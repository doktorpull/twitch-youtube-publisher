# Docker Compose для Twitch to YouTube Publisher

version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: twitch-youtube-publisher
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=https://your-domain.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - MONGODB_URI=mongodb://mongodb:27017/twitch-yt
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  mongodb:
    image: mongo:6.0
    container_name: twitch-youtube-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

  nginx:
    image: nginx:alpine
    container_name: twitch-youtube-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app

volumes:
  mongodb_data:

# Переменные окружения (создайте .env файл)
# NEXTAUTH_SECRET=your-secret-key-here
# NEXTAUTH_URL=https://your-domain.com
# MONGODB_URI=mongodb://mongodb:27017/twitch-yt
# YOUTUBE_API_KEY=your-youtube-api-key
# TELEGRAM_BOT_TOKEN=your-telegram-bot-token
# JWT_SECRET=your-jwt-secret
# MONGO_ROOT_PASSWORD=your-mongo-password